
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #e9d5ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #263568;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #536dfe;
            box-shadow: 0 0 0 3px rgba(83,109,254,0.12);
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #536dfe;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #3949ab;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Feedback</h1>
    <p class="subtitle">We value your thoughts and suggestions.</p>

    <form action="submitFeedback" method="POST">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="feedbackType">Feedback Type</label>
            <select id="feedbackType" name="feedbackType" required>
                <option value="Complaint">Complaint</option>
                <option value="Suggestion">Suggestion</option>
                <option value="Compliment">Compliment</option>
            </select>
        </div>

        <div class="form-group">
            <label for="comments">Your Comments</label>
            <textarea id="comments" name="comments"
                      rows="5" placeholder="Write your feedback here..."
                      required></textarea>
        </div>

        <button type="submit">Submit Feedback</button>

    </form>

    <div class="footer">
        Student Feedback Portal
    </div>

</div>

</body>
</html>
